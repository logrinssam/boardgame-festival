<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>

}

    --seq0: #1a1a19; --seq1: #1c2f47; --seq2: #1e3f66; --seq3: #205088; --seq4: #2666ab; --seq5: #3987e5; --seq6: #6da7ec; --seq7: #b7d3f6;

  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #111110; --surface: #1a1a19; --surface-2: #232321; --line: #2c2c2a; --line-strong: #383835;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #6da7ec; --s5: #9ec5f4;
  --seq0: #1a1a19; --seq1: #1c2f47; --seq2: #1e3f66; --seq3: #205088; --seq4: #2666ab; --seq5: #3987e5; --seq6: #6da7ec; --seq7: #b7d3f6;
  --heat-ink-hi: #0b0b0b; --focus: #6da7ec;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px; padding-inline: 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 18px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px 16px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 16px; margin-bottom: 6px; }

.tools { display: flex; gap: 6px; flex-shrink: 0; }
.tools button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; }
.tools button.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tools button:hover { filter: brightness(0.96); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.opts label { font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.opts label:has(input:checked) { border-color: var(--s1); color: var(--s1); font-weight: 600; }
.opts input { position: absolute; opacity: 0; width: 0; height: 0; }
#capture { padding: 6px 0 2px; }
.chart-box { position: relative; width: 100%; }
.chart-box canvas { max-width: 100%; }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 4px 0 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.heat { overflow-x: auto; }
.heat table { border-collapse: separate; border-spacing: 2px; font-variant-numeric: tabular-nums; font-size: 12.5px; }

.heat td.total, .heat tr.total td { font-weight: 600; color: var(--ink); background: var(--surface-2); }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.tablewrap { overflow-x: auto; margin-top: 10px; }

.overlay .box { background: var(--surface); border-radius: 10px; padding: 14px; max-width: min(1100px, 100%); max-height: 100%; overflow: auto; }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }

.filters .seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }

.filters label { font-size: 12px; color: var(--muted); margin-right: 4px; }
.filters .chip { font-size: 12px; background: var(--surface-2); color: var(--ink-2); border-radius: 999px; padding: 3px 10px; }
.filters .clear { font: inherit; font-size: 12px; background: none; border: 0; color: var(--s1); cursor: pointer; text-decoration: underline; }
.three { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.three > div:first-child { grid-column: 1 / -1; }
.three h3 { font-size: 14px; font-weight: 600; margin: 0 0 6px; color: var(--ink-2); }
@media (max-width: 760px) { .three { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>2026 창의융합보드게임대축제 참여 분석</h1>

</div>

<!-- 라이브러리는 analyze.py가 파일 안에 넣음 (휴대폰 앱에서 외부 CDN을 못 불러오는 경우 대비) -->
<script>/*__CHARTJS__*/</script>
<script>/*__HTML2CANVAS__*/</script>
<script>
const RAW = /*__DATA__*/null;
const DIMS = RAW.dims;

const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (n) => Number(n).toLocaleString('ko-KR');
const pct = (a, b) => b ? (a / b * 100) : 0;
const SEQ = () => [1,2,3,4,5,6,7].map(i => css('--seq' + i));

/* ---------- 필터 → 집계 (행: [부스, 분류, 시간대, 연령, 연령 구간, 성별, 유형, 익명참가자]) ---------- */
const filter = { cat: -1, booth: -1 };
let D = null;   // 현재 필터로 집계한 결과
function aggregate(rows) {
  const nb = DIMS.booths.length, ns = DIMS.slots.length, na = DIMS.ages.length, ng = DIMS.groups.length;
  const z = (n) => new Array(n).fill(0);
  const bySlot = DIMS.types.map(() => z(ns)), ages = z(na), groups = z(ng), types = z(DIMS.types.length);
  const boothByGroup = Array.from({ length: nb }, () => z(ng)), boothBySlot = Array.from({ length: nb }, () => z(ns)), groupBySlot = Array.from({ length: ng }, () => z(ns));
  const genderByGroup = Array.from({ length: ng }, () => z(2)), boothCount = z(nb), boothPids = Array.from({ length: nb }, () => new Set());
  const perPid = new Map(); let ageMissing = 0;
  for (const [b, c, s, a, gr, g, t, pid] of rows) {
    bySlot[t][s]++; types[t]++; boothCount[b]++; boothBySlot[b][s]++;
    if (a >= 0) ages[a]++;
    if (gr >= 0) { groups[gr]++; boothByGroup[b][gr]++; groupBySlot[gr][s]++; if (g >= 0) genderByGroup[gr][g]++; } else ageMissing++;
    if (pid >= 0) { boothPids[b].add(pid); if (!perPid.has(pid)) perPid.set(pid, new Set()); perPid.get(pid).add(b); }
  }
  return {
    total: rows.length, unique: perPid.size, ageMissing, boothsActive: boothCount.filter(x => x > 0).length,
    bySlot: Object.fromEntries(DIMS.types.map((t, i) => [t, bySlot[i]])),
    booths: DIMS.booths.map((b, i) => ({ ...b, count: boothCount[i], unique: boothPids[i].size })).filter(b => b.count > 0),
    ages: DIMS.ages.map((a, i) => ({ name: a, count: ages[i], kinder: a.startsWith('유치') })),
    groups: DIMS.groups.map((g, i) => ({ name: g, count: groups[i] })),
    types: DIMS.types.map((t, i) => ({ name: t, count: types[i] })),
    boothByGroup: { rows: DIMS.booths.map(b => b.name), cols: DIMS.groups, values: boothByGroup, keep: boothCount.map(x => x > 0) },
    boothBySlot: { rows: DIMS.booths.map(b => b.name), cols: DIMS.slots, values: boothBySlot, keep: boothCount.map(x => x > 0) },
    groupBySlot: { rows: DIMS.groups, cols: DIMS.slots, values: groupBySlot },
    genderByGroup: { rows: DIMS.groups, cols: DIMS.genders, values: genderByGroup },
  };
}
function applyFilter() {
  const rows = RAW.rows.filter(r => (filter.cat < 0 || r[1] === filter.cat) && (filter.booth < 0 || r[0] === filter.booth));
  D = aggregate(rows);
  const parts = []; if (filter.cat >= 0) parts.push(DIMS.cats[filter.cat]); if (filter.booth >= 0) parts.push(DIMS.booths[filter.booth].name);
  document.getElementById('filterChip').textContent = parts.length ? parts.join(' · ') + ` — ${fmt(D.total)}건` : `전체 ${fmt(D.total)}건`;
  document.getElementById('clearBtn').hidden = !parts.length;
  renderKpis();
}
function filterLabel() { const p = []; if (filter.cat >= 0) p.push(DIMS.cats[filter.cat]); if (filter.booth >= 0) p.push(DIMS.booths[filter.booth].name); return p.length ? ` · ${p.join(' · ')}` : ''; }

/* ---------- 뷰 정의 ---------- */
const VIEWS = [
  { grp: '부스 상세' },
  { id: 'boothDetail', title: '부스 상세', desc: '시간대별·연령별·성별 참여를 한 화면에. 아래에서 부스를 고르면 그 부스만, 전체를 고르면 모든 부스 합계를 보여줍니다.', render: renderBoothDetail },
  { grp: '기본 현황' },
  { id: 'slot', title: '시간대별 참여 건수', desc: '참여한 시간 기준, 30분 단위. 예약은 체험 시간, 현장 등록은 부스 등록 시각. 운영 전·점심시간(12~13시)에 미리 등록한 경우는 09:00·13:00으로 셈.',
    opts: [['stack', '누적 (현장/예약)'], ['total', '합계만']], render: renderSlot },
  { id: 'booth', title: '부스별 참여 건수', desc: '부스별 참여 건수. 색은 운영 방식(현장 등록 / 시간 예약).',
    opts: [['count', '참여 건수'], ['unique', '고유 참가자 수']], render: renderBooth },
  { id: 'age', title: '연령별 참여 건수', desc: '유치 3~7세, 초등 1~6학년. 연령 미기재 건은 제외.', render: renderAge },
  { id: 'share', title: '연령 구간 · 참가 유형 비율', desc: '참여 건수 대비 비율.', render: renderShare },
  { grp: '교차 분석' },
  { id: 'boothAge', title: '부스 × 연령 구간', desc: '각 부스에 어느 연령이 왔는지. 색이 진할수록 많음.',
    opts: [['count', '건수'], ['rowpct', '부스 내 비율 %']], render: () => renderHeat(D.boothByGroup, '부스', '연령 구간') },
  { id: 'boothSlot', title: '부스 × 시간대', desc: '부스별 피크 시간대.',
    opts: [['count', '건수'], ['rowpct', '부스 내 비율 %']], render: () => renderHeat(D.boothBySlot, '부스', '시간대') },
  { id: 'groupSlot', title: '연령 구간 × 시간대', desc: '연령대별 방문 시간 분포.',
    opts: [['count', '건수'], ['rowpct', '구간 내 비율 %']], render: () => renderHeat(D.groupBySlot, '연령 구간', '시간대') },
  { id: 'gender', title: '연령 구간 × 성별', desc: '성별 미기재 건 제외.', render: renderGender },
];
let current = null, chart = null, chart2 = null, chart3 = null, opt = {}, tableOn = false;

/* ---------- 공통 ---------- */
function baseOptions(extra = {}) {
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = css('--muted');
  return Object.assign({
    responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
    plugins: { legend: { labels: { color: css('--ink-2'), boxWidth: 12, boxHeight: 12, usePointStyle: false } },
               tooltip: { backgroundColor: css('--ink'), titleColor: css('--surface'), bodyColor: css('--surface'), padding: 10, cornerRadius: 6 } },
    scales: { x: { grid: { display: false }, border: { color: css('--line-strong') }, ticks: { color: css('--muted') } },
              y: { grid: { color: css('--line') }, border: { display: false }, ticks: { color: css('--muted') }, beginAtZero: true } },
  }, extra);
}
function canvas(h) {
  const box = document.createElement('div'); box.className = 'chart-box'; box.style.height = h + 'px';
  const c = document.createElement('canvas'); box.appendChild(c); return [box, c];
}
function legendHtml(items) { return '<div class="legend">' + items.map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join('') + '</div>'; }
function killCharts() { for (const c of [chart, chart2, chart3]) if (c) c.destroy(); chart = chart2 = chart3 = null; }
function table(head, rows) {
  return '<table class="data"><thead><tr>' + head.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map((v, i) => `<td>${typeof v === 'number' ? fmt(v) : v}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
}
function empty(area, msg) { area.innerHTML = `<p class="note" style="padding:24px 0">${msg}</p>`; return { note: '', table: '' }; }

/* ---------- 차트 조각 (뷰와 부스 상세에서 같이 씀) ---------- */
function slotBars(c, opts = {}) {
  const types = DIMS.types; const cols = [css('--s1'), css('--s2')];
  const totals = DIMS.slots.map((_, i) => types.reduce((a, t) => a + D.bySlot[t][i], 0));
  const stack = opts.stack !== false;
  let ds = stack ? types.map((t, i) => ({ label: t, data: D.bySlot[t], backgroundColor: cols[i], borderColor: css('--surface'), borderWidth: { top: 1.5, bottom: 0 }, borderSkipped: false, borderRadius: i === types.length - 1 ? 4 : 0 }))
                 : [{ label: '참여 건수', data: totals, backgroundColor: cols[0], borderRadius: 4 }];
  ds = ds.filter(d => d.data.some(v => v > 0)); if (ds.length === 1) ds[0].borderRadius = 4;
  const ch = new Chart(c, { type: 'bar', data: { labels: DIMS.slots, datasets: ds },
    options: baseOptions({ scales: { x: { stacked: stack, grid: { display: false }, border: { color: css('--line-strong') } }, y: { stacked: stack, grid: { color: css('--line') }, border: { display: false }, beginAtZero: true } },
      plugins: { legend: { display: stack && ds.length > 1, labels: { color: css('--ink-2'), boxWidth: 12 } }, tooltip: { callbacks: { footer: (it) => '합계 ' + fmt(totals[it[0].dataIndex]) + '건' } } } }) });
  return [ch, totals];
}
function ageBars(c) {
  return new Chart(c, { type: 'bar', data: { labels: D.ages.map(a => a.name.split(' ')), datasets: [{ label: '참여 건수', data: D.ages.map(a => a.count), backgroundColor: D.ages.map(a => a.kinder ? css('--s3') : css('--s1')), borderRadius: 4 }] },
    options: baseOptions({ plugins: { legend: { display: false } } }) });
}
function genderBars(c) {
  const g = D.genderByGroup;
  return new Chart(c, { type: 'bar', data: { labels: g.rows, datasets: g.cols.map((s, j) => ({ label: s, data: g.values.map(r => r[j]), backgroundColor: [css('--s1'), css('--s2')][j], borderRadius: 4, barPercentage: 0.7 })) }, options: baseOptions() });
}
function donut(el, items, colors) {
  const tot = items.reduce((a, x) => a + x.count, 0);
  return new Chart(el, { type: 'doughnut', data: { labels: items.map(x => x.name), datasets: [{ data: items.map(x => x.count), backgroundColor: colors, borderColor: css('--surface'), borderWidth: 2 }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { display: false }, tooltip: { backgroundColor: css('--ink'), titleColor: css('--surface'), bodyColor: css('--surface'), callbacks: { label: (it) => ` ${fmt(it.raw)}건 (${pct(it.raw, tot).toFixed(0)}%)` } } } } });
}

/* ---------- 각 뷰 ---------- */
function renderSlot(area) {
  const [box, c] = canvas(380); area.appendChild(box);
  let totals; [chart, totals] = slotBars(c, { stack: opt.slot !== 'total' });
  const peak = totals.indexOf(Math.max(...totals));
  return { note: `피크 ${DIMS.slots[peak]} (${fmt(totals[peak])}건)${filterLabel()}`,
           table: table(['시간대', ...DIMS.types, '합계', '비율 %'], DIMS.slots.map((s, i) => [s, ...DIMS.types.map(t => D.bySlot[t][i]), totals[i], pct(totals[i], D.total).toFixed(1)])) };
}
function renderBooth(area) {
  const key = opt.booth === 'unique' ? 'unique' : 'count';
  const b = [...D.booths].sort((x, y) => y[key] - x[key]);
  const [box, c] = canvas(30 * b.length + 60); area.appendChild(box);
  chart = new Chart(c, { type: 'bar', data: { labels: b.map(x => x.name), datasets: [{ label: key === 'unique' ? '고유 참가자 수' : '참여 건수', data: b.map(x => x[key]), backgroundColor: b.map(x => x.reserved ? css('--s2') : css('--s1')), borderRadius: 4, barThickness: 18 }] },
    options: baseOptions({ indexAxis: 'y', scales: { x: { grid: { color: css('--line') }, border: { display: false }, beginAtZero: true }, y: { grid: { display: false }, border: { color: css('--line-strong') }, ticks: { color: css('--ink-2'), autoSkip: false } } },
      plugins: { legend: { display: false }, tooltip: { callbacks: { afterLabel: (it) => `${b[it.dataIndex].cat} · 대상: ${b[it.dataIndex].target}` } } } }) });
  area.insertAdjacentHTML('afterbegin', legendHtml([[css('--s1'), '현장 등록(자유체험)'], [css('--s2'), '시간 예약']]));
  const top3 = b.slice(0, 3).reduce((a, x) => a + x[key], 0);
  return { note: b.length > 3 ? `상위 3개 부스가 ${pct(top3, key === 'unique' ? D.unique : D.total).toFixed(0)}%${filterLabel()}` : filterLabel().slice(3),
           table: table(['부스', '분류', '대상', '참여 건수', '고유 참가자', '비율 %'], b.map(x => [x.name, x.cat, x.target, x.count, x.unique, pct(x.count, D.total).toFixed(1)])) };
}
function renderAge(area) {
  const [box, c] = canvas(360); area.appendChild(box); chart = ageBars(c);
  area.insertAdjacentHTML('afterbegin', legendHtml([[css('--s3'), '유치부'], [css('--s1'), '초등']]));
  const top = [...D.ages].sort((a, b) => b.count - a.count)[0];
  return { note: `최다 연령 ${top.name} (${fmt(top.count)}건). 학년 미기재 ${D.total - D.ages.reduce((x, y) => x + y.count, 0)}건 제외${filterLabel()}`,
           table: table(['연령', '참여 건수', '비율 %'], D.ages.map(a => [a.name, a.count, pct(a.count, D.total).toFixed(1)])) };
}
function renderShare(area) {
  area.innerHTML = '<div class="two"><div><h3>연령 구간</h3><div class="chart-box" style="height:300px"><canvas id="d1"></canvas></div><div id="l1"></div></div><div><h3>참가 유형</h3><div class="chart-box" style="height:300px"><canvas id="d2"></canvas></div><div id="l2"></div></div></div>';
  const g = D.groups; const gc = [css('--s3'), css('--s1'), css('--s4'), css('--s5')];
  const t = D.types; const tc = [css('--s1'), css('--s2')];
  chart = donut(document.getElementById('d1'), g, gc); chart2 = donut(document.getElementById('d2'), t, tc);
  const gt = g.reduce((a, x) => a + x.count, 0), tt = t.reduce((a, x) => a + x.count, 0);
  document.getElementById('l1').innerHTML = legendHtml(g.map((x, i) => [gc[i], `${x.name} ${fmt(x.count)}건 (${pct(x.count, gt).toFixed(0)}%)`]));
  document.getElementById('l2').innerHTML = legendHtml(t.map((x, i) => [tc[i], `${x.name} ${fmt(x.count)}건 (${pct(x.count, tt).toFixed(0)}%)`]));
  return { note: `연령 구간은 미기재 ${D.ageMissing}건 제외 (${fmt(gt)}건 기준). 시간 예약에는 현장 수기 예약 포함${filterLabel()}`,
           table: table(['구분', '항목', '참여 건수', '비율 %'], [...g.map(x => ['연령 구간', x.name, x.count, pct(x.count, gt).toFixed(1)]), ...t.map(x => ['참가 유형', x.name, x.count, pct(x.count, tt).toFixed(1)])]) };
}
function renderHeat(m0, rowLabel, colLabel) {
  const area = document.getElementById('chartArea'); const rowpct = opt[current.id] === 'rowpct';
  const keep = m0.keep || m0.rows.map(() => true);
  const m = { rows: m0.rows.filter((_, i) => keep[i]), cols: m0.cols, values: m0.values.filter((_, i) => keep[i]) };
  if (!m.rows.length) return empty(area, '해당 조건에 데이터가 없습니다.');
  const rowTot = m.values.map(r => r.reduce((a, b) => a + b, 0)); const colTot = m.cols.map((_, j) => m.values.reduce((a, r) => a + r[j], 0));
  const vals = rowpct ? m.values.map((r, i) => r.map(v => pct(v, rowTot[i]))) : m.values;
  const max = Math.max(1, ...vals.flat()); const seq = SEQ();
  const color = (v) => v <= 0 ? css('--seq0') : seq[Math.min(seq.length - 1, Math.floor(v / max * (seq.length - 0.001)))];
  const inkFor = (v) => v / max > 0.55 ? css('--heat-ink-hi') : css('--ink-2');
  let h = `<div class="heat"><table><thead><tr><th>${rowLabel} \\ ${colLabel}</th>` + m.cols.map(c => `<th>${c}</th>`).join('') + '<th>합계</th></tr></thead><tbody>';
  m.rows.forEach((r, i) => { h += `<tr><th>${r}</th>` + m.cols.map((c, j) => { const v = vals[i][j]; return `<td style="background:${color(v)};color:${inkFor(v)}" title="${r} · ${c}: ${fmt(m.values[i][j])}건${rowpct ? ` (${v.toFixed(0)}%)` : ''}">${v > 0 ? (rowpct ? v.toFixed(0) : fmt(v)) : ''}</td>`; }).join('') + `<td class="total">${fmt(rowTot[i])}</td></tr>`; });
  h += '<tr class="total"><th>합계</th>' + colTot.map(v => `<td>${fmt(v)}</td>`).join('') + `<td>${fmt(colTot.reduce((a, b) => a + b, 0))}</td></tr></tbody></table></div>`;
  area.innerHTML = h;
  return { note: (rowpct ? '각 행(가로) 합계 = 100%. 셀에 마우스를 올리면 건수 표시' : '셀에 마우스를 올리면 상세 표시') + filterLabel(),
           table: table([rowLabel, ...m.cols, '합계'], m.rows.map((r, i) => [r, ...m.values[i], rowTot[i]])) };
}
function renderGender(area) {
  const [box, c] = canvas(340); area.appendChild(box); chart = genderBars(c); const g = D.genderByGroup;
  return { note: '성별 미기재 건 제외' + filterLabel(), table: table(['연령 구간', ...g.cols, '여아 비율 %'], g.rows.map((r, i) => [r, ...g.values[i], pct(g.values[i][1], g.values[i][0] + g.values[i][1]).toFixed(0)])) };
}
function renderBoothDetail(area) {
  const b = filter.booth >= 0 ? DIMS.booths[filter.booth] : null;
  const list = DIMS.booths.map((x, i) => [x, i]).filter(([x]) => filter.cat < 0 || DIMS.cats.indexOf(x.cat) === filter.cat);
  area.innerHTML = '<div class="opts" id="boothPick" style="margin:0 0 12px">' + `<label><input type="radio" name="bp" id="bp-all" value="-1" ${filter.booth < 0 ? 'checked' : ''}>전체</label>` + list.map(([x, i]) => `<label><input type="radio" name="bp" id="bp-${i}" value="${i}" ${i === filter.booth ? 'checked' : ''}>${x.name}</label>`).join('') + '</div>' + '<div class="three"><div><h3>시간대별</h3><div class="chart-box" style="height:260px"><canvas id="b1"></canvas></div></div><div><h3>연령별</h3><div class="chart-box" style="height:260px"><canvas id="b2"></canvas></div></div><div><h3>연령 구간 × 성별</h3><div class="chart-box" style="height:260px"><canvas id="b3"></canvas></div></div></div>';
  area.querySelectorAll('#boothPick input').forEach(el => el.addEventListener('change', () => setFilter({ booth: Number(el.value) })));
  [chart] = slotBars(document.getElementById('b1')); chart2 = ageBars(document.getElementById('b2')); chart3 = genderBars(document.getElementById('b3'));
  const totals = DIMS.slots.map((_, i) => DIMS.types.reduce((a, t) => a + D.bySlot[t][i], 0)); const peak = totals.indexOf(Math.max(...totals));
  const top = [...D.ages].sort((x, y) => y.count - x.count)[0];
  const gsum = D.genderByGroup.values.reduce((a, r) => [a[0] + r[0], a[1] + r[1]], [0, 0]);
  const head = b ? `${b.name} · ${b.cat} · 대상 ${b.target}` : (filter.cat >= 0 ? `${DIMS.cats[filter.cat]} 전체 부스` : '전체 부스');
  return { note: `${head} — ${fmt(D.total)}건, ${fmt(D.unique)}명. 피크 ${DIMS.slots[peak]} (${totals[peak]}건), 최다 연령 ${top.name} (${top.count}건), 남 ${gsum[0]} / 여 ${gsum[1]}`,
           table: table(['구분', '항목', '참여 건수'], [...DIMS.slots.map((s, i) => ['시간대', s, totals[i]]).filter(r => r[2] > 0), ...D.ages.map(a => ['연령', a.name, a.count]).filter(r => r[2] > 0)]) };
}

/* ---------- 조립 ---------- */
function show(id) {
  current = VIEWS.find(v => v.id === id); killCharts();
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const suffix = filter.booth >= 0 && current.id !== 'boothDetail' ? ` — ${DIMS.booths[filter.booth].name}` : filter.cat >= 0 ? ` — ${DIMS.cats[filter.cat]}` : '';
  document.getElementById('ptitle').textContent = current.title + suffix;
  document.getElementById('pdesc').textContent = current.desc;
  const o = document.getElementById('opts'); o.innerHTML = '';
  if (current.opts) { if (!opt[id]) opt[id] = current.opts[0][0];
    current.opts.forEach(([k, l]) => { o.insertAdjacentHTML('beforeend', `<label><input type="radio" name="opt-${id}" id="opt-${id}-${k}" value="${k}" ${opt[id] === k ? 'checked' : ''}>${l}</label>`); });
    o.querySelectorAll('input').forEach(i => i.addEventListener('change', () => { opt[id] = i.value; show(id); })); }
  const area = document.getElementById('chartArea'); area.innerHTML = '';
  let r;
  try { r = D.total ? current.render(area) : empty(area, '해당 조건에 데이터가 없습니다.'); }
  catch (e) { r = empty(area, '차트를 그리지 못했습니다: ' + (e && e.message || e) + ' — 새로고침하거나 표 보기를 이용하세요.'); }
  document.getElementById('pnote').textContent = r.note || '';
  const tw = document.getElementById('tablewrap'); tw.innerHTML = r.table || ''; tw.hidden = !tableOn;
  try { localStorage.setItem('bgf-view', id); } catch (e) {}
}
function renderKpis() {
  const k = [['참여 건수', fmt(D.total), '건'], ['고유 참가자', fmt(D.unique), '명'], ['부스', D.boothsActive, '곳']];
  if (filter.cat < 0 && filter.booth < 0) k.splice(2, 0, ['가족(연락처) 수', fmt(RAW.meta.families), '가족']);
  document.getElementById('kpis').innerHTML = k.map(([l, v, u]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}<small>${u}</small></div></div>`).join('');
}
function setFilter(patch) {
  Object.assign(filter, patch);
  const sel = document.getElementById('boothSel');
  // 분류를 바꾸면 그 분류에 없는 부스는 선택 해제하고, 목록에서도 숨김
  if (filter.booth >= 0 && filter.cat >= 0 && DIMS.cats.indexOf(DIMS.booths[filter.booth].cat) !== filter.cat) filter.booth = -1;
  [...sel.options].forEach(o => { const i = Number(o.value); o.hidden = i >= 0 && filter.cat >= 0 && DIMS.cats.indexOf(DIMS.booths[i].cat) !== filter.cat; });
  sel.value = String(filter.booth);
  document.querySelectorAll('#catSeg button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.cat) === filter.cat)));
  applyFilter();
  try { localStorage.setItem('bgf-filter', JSON.stringify(filter)); } catch (e) {}
  const goDetail = patch.booth !== undefined && patch.booth >= 0;
  show(goDetail ? 'boothDetail' : current.id);
}
function init() {
  document.getElementById('src').textContent = `자료: ${RAW.meta.source}`;
  const seg = document.getElementById('catSeg');
  seg.innerHTML = `<button type="button" id="catAll" data-cat="-1" aria-pressed="true">전체</button>` + DIMS.cats.map((c, i) => `<button type="button" data-cat="${i}" aria-pressed="false">${c}</button>`).join('');
  seg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setFilter({ cat: Number(b.dataset.cat) }); });
  const sel = document.getElementById('boothSel');
  sel.innerHTML = '<option value="-1">전체 부스</option>' + DIMS.booths.map((b, i) => `<option value="${i}">${b.name}</option>`).join('');
  sel.addEventListener('change', () => setFilter({ booth: Number(sel.value) }));
  document.getElementById('clearBtn').addEventListener('click', () => setFilter({ cat: -1, booth: -1 }));
  const nav = document.getElementById('nav');
  VIEWS.forEach(v => { if (v.grp) nav.insertAdjacentHTML('beforeend', `<div class="grp">${v.grp}</div>`); else nav.insertAdjacentHTML('beforeend', `<button type="button" data-id="${v.id}">${v.title}</button>`); });
  nav.addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.id); });
  document.getElementById('btnTable').addEventListener('click', e => { tableOn = !tableOn; e.currentTarget.setAttribute('aria-pressed', tableOn); e.currentTarget.textContent = tableOn ? '표 숨기기' : '표 보기'; document.getElementById('tablewrap').hidden = !tableOn; });
  document.getElementById('btnPng').addEventListener('click', savePng);
  let first = 'boothDetail', f = {}; try { first = localStorage.getItem('bgf-view') || 'boothDetail'; f = JSON.parse(localStorage.getItem('bgf-filter') || '{}'); } catch (e) {}
  Object.assign(filter, { cat: Number.isInteger(f.cat) && f.cat < DIMS.cats.length ? f.cat : -1, booth: Number.isInteger(f.booth) && f.booth < DIMS.booths.length ? f.booth : -1 });
  current = VIEWS.find(v => v.id === first && v.id) || VIEWS[1];
  setFilter({});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => show(current.id));
  new MutationObserver(() => show(current.id)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
async function savePng() {
  const el = document.getElementById('capture'); const title = current.title;
  const wrap = document.createElement('div'); wrap.style.cssText = `background:${css('--surface')};padding:20px 24px;width:${el.offsetWidth + 48}px;font-family:${getComputedStyle(document.body).fontFamily}`;
  wrap.innerHTML = `<div style="font-size:18px;font-weight:700;color:${css('--ink')};margin-bottom:10px">${title}</div>`;
  const clone = el.cloneNode(true); wrap.appendChild(clone);
  // canvas는 cloneNode로 복제되지 않으므로 그림을 옮겨 그림
  const src = el.querySelectorAll('canvas'), dst = clone.querySelectorAll('canvas');
  src.forEach((s, i) => { dst[i].width = s.width; dst[i].height = s.height; dst[i].style.cssText = s.style.cssText; dst[i].getContext('2d').drawImage(s, 0, 0); });
  wrap.style.position = 'fixed'; wrap.style.left = '-10000px'; wrap.style.top = '0'; document.body.appendChild(wrap);
  try {
    const cv = await html2canvas(wrap, { backgroundColor: css('--surface'), scale: 2, useCORS: true });
    const url = cv.toDataURL('image/png'); const name = `축제분석_${title.replace(/[^\w가-힣]+/g, '_')}.png`;
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    // claude.ai 뷰어에서는 downloads 기능으로, 로컬 파일로 열었을 때는 일반 다운로드로 저장
    const dl = window.claude?.use ? await claude.use('downloads') : null;
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); toast('이미지를 저장했습니다'); }
      catch (e) { if (e?.code !== 'declined') toast('저장할 수 없습니다: ' + (e?.message || e)); }
    } else {
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    }
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="box"><div class="bar"><span>미리보기. 저장되지 않았다면 이미지를 <b>우클릭 → 이미지 저장</b>(모바일: 길게 누르기) 하세요.</span><span><button type="button" id="ovCopy" style="font:inherit;padding:5px 10px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;margin-right:6px">클립보드에 복사</button><button type="button" id="ovClose" style="font:inherit;padding:5px 10px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer">닫기</button></span></div><img alt="${title}" src="${url}"></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#ovClose').onclick = () => ov.remove(); ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
    ov.querySelector('#ovCopy').onclick = async () => { try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); toast('이미지를 복사했습니다'); } catch (e) { toast('복사가 지원되지 않는 환경입니다'); } };
  } catch (e) { toast('이미지 생성에 실패했습니다: ' + e.message); }
  wrap.remove();
}
document.fonts ? document.fonts.ready.then(init) : init();
</script>
